tool:
    name: tgbotspec
    main: ./cmd/tgbotspec
version:
    source: git-tag
targets:
    - os: darwin
      arch: amd64
    - os: darwin
      arch: arm64
    - os: linux
      arch: amd64
    - os: linux
      arch: arm64
    - os: windows
      arch: amd64
build:
    ldflags: -s -w
    tags: []
    cgo: false
distributions:
    npm:
        package: '@tgbotspec/tgbotspec'
        registry: https://registry.npmjs.org
        access: public
    uv:
        package: tgbotspec
        index-url: https://upload.pypi.org/legacy/
        linux-tag: manylinux2014
